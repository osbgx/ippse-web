name: Deploy a GitHub Pages

# Publicación temporal del sitio en GitHub Pages, hasta contar con la aprobación del cliente.
# El deploy definitivo seguirá siendo en cPanel (subiendo dist/ a public_html).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # DEPLOY_TARGET=pages activa base "/ippse-web" y site "https://osbgx.github.io".
      # Sin esa variable, el build queda listo para cPanel con base "/".
      #
      # Los datos de contacto se pueden definir como "Variables" del repositorio
      # (Settings > Secrets and variables > Actions > Variables). Si no están, se
      # usan los valores por defecto de src/data/contacto.ts.
      #
      # GITHUB_TOKEN: lo provee Actions automáticamente. El loader de publicaciones
      # lee el repositorio de contenido por la API de GitHub; sin token, el límite
      # anónimo (60 peticiones/hora por IP) puede hacer fallar el build.
      - run: npm run build
        env:
          DEPLOY_TARGET: pages
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_IPPSE_EMAIL: ${{ vars.PUBLIC_IPPSE_EMAIL }}
          PUBLIC_IPPSE_TELEFONO: ${{ vars.PUBLIC_IPPSE_TELEFONO }}
          PUBLIC_IPPSE_CIUDAD: ${{ vars.PUBLIC_IPPSE_CIUDAD }}
          PUBLIC_IPPSE_WHATSAPP: ${{ vars.PUBLIC_IPPSE_WHATSAPP }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
