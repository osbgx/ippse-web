name: Deploy a GitHub Pages

# Publicación temporal del sitio en GitHub Pages, hasta contar con la aprobación del cliente.
# El deploy definitivo seguirá siendo en cPanel (subiendo dist/ a public_html).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # DEPLOY_TARGET=pages activa base "/ippse-web" y site "https://osbgx.github.io".
      # Sin esa variable, el build queda listo para cPanel con base "/".
      - run: npm run build
        env:
          DEPLOY_TARGET: pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
